name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned by commit (the tag in the comment); every job gets a read-only token unless it says otherwise.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build, sign, notarize & semantic-release
    needs: secrets-scan
    runs-on: macos-latest
    # semantic-release pushes the release commit and tag, creates the GitHub release and comments on issues / PRs
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      # On main a release is published, and it must be signed and notarized: the job fails when a secret is missing
      # (an unsigned build would otherwise go out as a release and through the updater / Homebrew). A manual run on
      # another branch may build unsigned. electron-builder treats an *empty* CSC_LINK as a file path, so the
      # variables are only exported when the secrets exist.
      - name: Configure signing & notarization
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            missing=""
            for v in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              [ -n "${!v}" ] || missing="$missing $v"
            done
            if [ -n "$missing" ]; then
              echo "::error::release from main needs the signing and notarization secrets; missing:$missing"
              exit 1
            fi
          fi
          if [ -n "$MAC_CERT_P12" ]; then
            { echo "CSC_LINK<<__CSC_EOF__"; echo "$MAC_CERT_P12"; echo "__CSC_EOF__"; } >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "signing: Developer ID certificate configured"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "signing: MAC_CERT_P12 secret not set, building unsigned"
          fi
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
            { echo "APPLE_API_KEY=$KEY"; echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; } >> "$GITHUB_ENV"
            echo "notarization: App Store Connect API key configured"
          else
            echo "notarization: APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER not set, skipped"
          fi
      - name: Release (version bump, changelog, signed DMG build, GitHub release, Homebrew tap)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK / CSC_KEY_PASSWORD / APPLE_API_* come from the step above (only when the secrets exist).
          # Deploy key with write access to Hyeongcheol-An/homebrew-tap → scripts/update-cask.sh pushes the cask — only in
          # semantic-release's success step (.releaserc.json), once the GitHub release and its DMGs exist; the prepare step
          # writes Casks/mobalt.rb for the release commit with the key blanked, so a run that fails after prepare (a push to
          # main meanwhile, say) never leaves the tap pointing at a download that is not there.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
