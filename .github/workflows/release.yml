name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build, sign, notarize & semantic-release
    needs: secrets-scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      # Signing/notarization secrets are optional. electron-builder treats an *empty* CSC_LINK as a file path,
      # so the variables are only exported when the secrets exist.
      - name: Configure signing & notarization
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            { echo "CSC_LINK<<__CSC_EOF__"; echo "$MAC_CERT_P12"; echo "__CSC_EOF__"; } >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "signing: Developer ID certificate configured"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "signing: MAC_CERT_P12 secret not set, building unsigned"
          fi
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
            { echo "APPLE_API_KEY=$KEY"; echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; } >> "$GITHUB_ENV"
            echo "notarization: App Store Connect API key configured"
          else
            echo "notarization: APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER not set, skipped"
          fi
      - name: Release (version bump, changelog, signed DMG build, GitHub release, Homebrew tap)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK / CSC_KEY_PASSWORD / APPLE_API_* come from the step above (only when the secrets exist).
          # Deploy key with write access to Hyeongcheol-An/homebrew-tap → scripts/update-cask.sh pushes the cask
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
